services:
  - type: web
    name: smarthire-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free           # upgrade if needed to avoid cold starts
    region: singapore    # closest to India
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false      # set manually in Render dashboard
      - key: MONGODB_DB_NAME
        value: smarthire_db
      - key: GEMINI_API_KEY
        sync: false      # set manually in Render dashboard
      - key: ENV
        value: production
      - key: FRONTEND_URL
        sync: false      # set to https://my-app-ruddy-five.vercel.app

