services:
  - type: web
    name: smarthire-backend
    env: python
    rootDir: Backend
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smarthire_db
      - key: GEMINI_API_KEY
        sync: false
      - key: ENV
        value: production
      - key: FRONTEND_URL
        value: https://my-app-ruddy-five.vercel.app
      - key: PYTHON_VERSION
        value: 3.10.0
