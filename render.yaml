services:
  - type: web
    name: smarthire-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free           # upgrade to starter ($7/mo) to avoid cold starts
    region: singapore    # closest to India
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false      # set manually in Render dashboard
      - key: MONGODB_DB_NAME
        value: smarthire_db
      - key: GEMINI_API_KEY
        sync: false      # set manually in Render dashboard
      - key: ENV
        value: production
      - key: FRONTEND_URL
        sync: false      # set to your Vercel URL, e.g. https://smarthire-xyz.vercel.app
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false      # only needed here if backend validates it
